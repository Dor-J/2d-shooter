name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
  issues: write
  checks: write
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check:gaps
      - run: node --test scripts/check-gap-coverage.test.mjs
      - run: node --test scripts/ops-policy.test.mjs
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.88.0'
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo install wasm-pack --version 0.13.1 --locked
      - run: npm run test:parity
      - run: wasm-pack build crates/game-core --target web --release --out-dir ../../apps/web/public/wasm --out-name game_core
      - uses: actions/upload-artifact@v4
        with:
          name: game-wasm
          path: apps/web/public/wasm
      - name: cargo audit
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
  web:
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: game-wasm
          path: apps/web/public/wasm
      - run: bun install --frozen-lockfile
        working-directory: apps/web
      - run: bun run lint
        working-directory: apps/web
      - run: bun run test
        working-directory: apps/web
      - run: bun run build
        working-directory: apps/web
      - name: npm audit
        working-directory: apps/web
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit --omit=dev
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.88.0'
      - name: Start server
        run: cargo run -p server &
      - name: Wait for health
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3000/health; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - run: node apps/web/scripts/smoke.mjs
